<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reel pronti — Fwd Studio</title>
<style>
  :root{
    --bg:#12151b; --surface:#1b212a; --surface-2:#232b36; --line:#2c3541;
    --text:#e9e7e2; --muted:#8b93a1; --amber:#f0a63d; --teal:#49c9bd;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:20px;
  }
  h1{ font-size:1.2rem; letter-spacing:0.02em; margin-bottom:4px; }
  p.sub{ color:var(--muted); font-size:0.85rem; margin-top:0; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; margin-top:20px; }
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:12px; display:flex; flex-direction:column; gap:8px;
  }
  video{ width:100%; border-radius:8px; background:#000; aspect-ratio:9/16; }
  .caption{
    font-size:0.82rem; color:var(--muted); max-height:80px; overflow-y:auto;
    white-space:pre-wrap; background:var(--surface-2); border-radius:6px; padding:8px;
  }
  .date{ font-size:0.7rem; color:var(--teal); font-family:ui-monospace,monospace; }
  .row{ display:flex; gap:8px; }
  button, a.btn{
    flex:1; text-align:center; background:var(--amber); color:#1a1206; border:none;
    border-radius:6px; padding:8px; font-size:0.8rem; font-weight:700; cursor:pointer;
    text-decoration:none;
  }
  button.copied{ background:var(--teal); }
  .empty{ color:var(--muted); font-size:0.9rem; margin-top:30px; text-align:center; }
</style>
</head>
<body>
  <h1>Reel pronti · Fwd Studio</h1>
  <p class="sub">Scarica il video e copia la caption, poi pubblica su Instagram.</p>
  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyMsg" style="display:none;">Nessun reel pronto al momento.</div>

<script>
(async function(){
  const grid = document.getElementById('grid');
  const emptyMsg = document.getElementById('emptyMsg');
  let reels = [];
  try{
    const res = await fetch('reels.json', { cache: 'no-store' });
    reels = await res.json();
  }catch(e){
    console.error('Impossibile caricare reels.json', e);
  }

  if(!reels.length){
    emptyMsg.style.display = 'block';
    return;
  }

  reels.forEach(reel => {
    const card = document.createElement('div');
    card.className = 'card';
    const dateStr = new Date(reel.createdAt).toLocaleString('it-IT');
    card.innerHTML = `
      <video src="${reel.video}" controls playsinline></video>
      <div class="date">${dateStr}</div>
      <div class="caption">${(reel.caption || '').replace(/</g,'&lt;')}</div>
      <div class="row">
        <a class="btn" href="${reel.video}" download>⬇ Scarica</a>
        <button data-action="copy">📋 Copia caption</button>
      </div>
    `;
    card.querySelector('[data-action=copy]').addEventListener('click', async (e) => {
      await navigator.clipboard.writeText(reel.caption || '');
      e.target.textContent = '✅ Copiato';
      e.target.classList.add('copied');
      setTimeout(() => { e.target.textContent = '📋 Copia caption'; e.target.classList.remove('copied'); }, 1500);
    });
    grid.appendChild(card);
  });
})();
</script>
</body>
</html>
